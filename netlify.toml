# Long-cache hashed static assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers applied to every response.
# CSP origins reflect ACTUAL usage: the map loads OpenStreetMap raster tiles
# (https://tile.openstreetmap.org) as <img>; Leaflet itself is bundled into
# /_next/static ('self'). The Google Maps / Google Fonts origins are kept from
# the standard template but are currently unused (site uses OSM + no web fonts).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://maps.googleapis.com https://maps.gstatic.com https://tile.openstreetmap.org; connect-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://www.bing.com https://tile.openstreetmap.org; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "unsafe-none"

# Keep Next.js build artifacts out of search results (does not block crawl/render).
[[headers]]
  for = "/_next/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# ---------------------------------------------------------------------------
# Studio churn from the pending data refresh (studios.json 239 -> 232 active).
# 46 /studio/ URLs stop being generated. All are live, indexed, and internally
# linked, so every one gets a 301 rather than a 404.
#
#   12 slug drift + 1 de-duplication -> the business's current studio page
#   33 genuine removals              -> the parent city page for the studio's
#                                       primary modality
#
# Modality routing for removals: contrast if the studio offered contrast or
# both hot and cold; otherwise cold-plunge / sauna / infrared-sauna. Studios
# with cryo only (no vertical page exists) fall back to cold-plunge.
#
# ===========================================================================
# EVERY /studio/ RULE BELOW IS DELIBERATELY force = false. DO NOT "TIDY" THEM
# BACK TO force = true.
# ===========================================================================
#
# What force does
#   Netlify applies an unforced redirect ONLY when no file exists at the
#   requested path. force = true makes the redirect win *over* an existing
#   file — a shadowing redirect.
#
# Why forcing these would be a bug
#   These 46 slugs were dropped by a scraper that was silently discarding a
#   tenth to a fifth of the directory every week (the pre-retention full-run
#   overwrite in scraper/scrape.py). 27 of the 33 "genuine removals" carried a
#   google_place_id and no website — the profile of a studio that one flaky
#   Google Maps render failed to return, NOT of a business that closed. A
#   healthy crawl is expected to re-discover many of them, and because the slug
#   is derived from (name, search-city) it will regenerate byte-identical.
#
#   With force = true, the moment that happens the studio's page exists AND is
#   permanently unreachable — every request 301s away from it. Worse, it fails
#   invisibly: a 301 to a plausible city page looks entirely intentional, so
#   nobody investigates. That is exactly how the churn itself went unnoticed
#   for weeks.
#
# Why unforced is correct in BOTH states
#   page absent (genuinely gone)  -> redirect fires, no 404 on an indexed URL
#   page present (re-discovered)  -> file served, redirect lies dormant
#   Self-healing. No list to maintain, nothing to remember.
#
#   Deleting the rules instead would be wrong in the first state: it re-creates
#   the 404s this section exists to prevent, for the handful that really did
#   close.
#
# The 4 remaining force = true rules in this file (apex/www consolidation and
# /sitemap.xml -> /sitemap_index.xml) redirect paths that DO exist as files and
# genuinely need to win. Those must stay forced. The distinction is the point.
#
# Enforced, not just documented: scraper/processors/quality_gate.py fails the
# weekly run (exit 2, no commit, no deploy) if any forced redirect shadows a
# live studio record, or if any /studio/ redirect target is not a live record.
# ---------------------------------------------------------------------------

