[build]
  # npm run build = next build → scripts/postexport.mjs → scripts/assert-build.mjs.
  # That last step is a gate, not a report: it asserts against the exported HTML
  # in out/ and exits non-zero, so a guide that starts rendering the affiliate
  # block on a Tier A health page, or a removed guide that comes back as a live
  # 200 and shadows its 301, fails the deploy instead of shipping.
  command = "npm run build"
  publish = "out"
  # Skip the build when a commit cannot possibly change the site.
  #
  # Netlify semantics: if this command exits 0 the build is CANCELLED; any other
  # exit code proceeds. `git diff --quiet` exits 0 when there is NO difference —
  # so this cancels precisely when every changed path is one the site does not
  # read.
  #
  # It is written as an EXCLUDE list, not an allowlist, and that direction
  # matters. The obvious form —
  #     git diff --quiet HEAD^ HEAD -- studios.json questions.json netlify.toml
  # — cancels whenever those specific files are untouched, which silently means
  # a change to app/ or lib/ would never deploy at all. Excluding what is
  # irrelevant fails safe: anything unrecognised builds.
  #
  # Excluded:
  #   scraper/            Python pipeline; runs on CT 170, never shipped to the CDN
  #   *.md                docs
  #   slug_registry.json  scraper-only artifact; no app code reads it (verified)
  #
  # Everything else — studios.json, questions.json, metros.json, app/, lib/,
  # components/, netlify.toml, package.json — triggers a normal build. Note that
  # netlify.toml is deliberately NOT excluded: a redirect change only takes
  # effect on deploy.
  #
  # HEAD^ missing (first commit, or a shallow clone without the parent) makes
  # git exit non-zero, which builds. Failing toward "build" is the safe default.
  ignore = "git diff --quiet HEAD^ HEAD -- . ':(exclude)scraper' ':(exclude)*.md' ':(exclude)slug_registry.json'"

[build.environment]
  NODE_VERSION = "22"

# Apex/alt domain consolidation: theicesoak.com 301-redirects to icesoak.com.
[[redirects]]
  from = "https://theicesoak.com/*"
  to = "https://icesoak.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.theicesoak.com/*"
  to = "https://icesoak.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.icesoak.com/*"
