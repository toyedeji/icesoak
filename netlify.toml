# ---------------------------------------------------------------------------
# Duplicate-record de-duplication, staged.
#
# Three pairs of records in studios.json describe ONE business each, recorded
# twice under different city labels for a single street address. deduper.py
# misses them because it keys on name+address and each pair carries different
# names; processors/identity.py catches them on the address tier.
#
# All six pages are LIVE right now. The slug registry resolves a fresh crawl of
# each address to the canonical slug, so the shadowed record is never re-seen
# and ages out through the normal missed_runs path — expected to drop around
# 2026-08-23 (3 consecutive misses at the Sunday cadence).
#
# These rules are pre-staged so that transition never produces a 404. They are
# force = false, which here is not merely preferable but REQUIRED: forcing them
# would break three live pages immediately. Unforced, each rule is dormant
# while its page exists and activates by itself the run the record drops out.
#
# If you instead merge the pairs by hand (recommended, since it reclaims the
# duplicate crawl budget), these rules become the correct permanent redirects
# and need no change.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/studio/sweathouz-fort-worth-fort-worth/"
  to = "/studio/sweathouz-camp-bowie-fort-worth/"
  status = 301
  force = false

[[redirects]]
  from = "/studio/sweathouz-vinings-vinings/"
  to = "/studio/sweathouz-atlanta-atlanta/"
  status = 301
  force = false

[[redirects]]
  from = "/studio/sweathouz-roswell-roswell/"
  to = "/studio/sweathouz-alpharetta-alpharetta/"
  status = 301
  force = false

# ---------------------------------------------------------------------------
# Guide removals — 2026-08-01 health-claims audit.
#
# Seven of the 32 live guides were dropped: two off-topic Dallas travel pages,
# three duplicate or near-duplicate questions, and two pages about a named
# living person's private health practices on a monetized directory. 32 -> 25.
#
# Every rule is single-hop and force = false, matching the studio redirects
# above. force = false is safe here because the pages are genuinely gone from
# questions.json AND their slugs are in guide_denylist.json, which both
# lib/data.ts and scraper/crawlers/questions.py honor — so no build can
# recreate the static file that would shadow these rules. scripts/assert-build.mjs
# fails the deploy if that stops being true.
#
# Source of truth for the pairs is guide_denylist.json. Change them together.
# ---------------------------------------------------------------------------

